# Worklynx marketing site — nginx config for SEO (live server: nginx 1.24, Ubuntu).
#
# Merge into the existing site config; don't overwrite it blindly. Keep any
# existing API proxy / certificate lines. Certificate paths below assume certbot.
#
# Fixes from the Phase 1 SEO audit:
#   C3  unknown URLs return a real 404; robots.txt and sitemap.xml are real files
#   H1  one canonical host (https://www.worklynx.io), single-hop 301s
#   H2  gzip for JS/CSS, long cache for hashed assets, HTTP/2
#   M3  HSTS and basic security headers
#
# The build (vite-plugin-seo.js) writes dist/<route>/index.html for every
# marketing route, plus dist/404.html and dist/sitemap.xml.

# --- Redirect everything that isn't https://www.worklynx.io -------------------
server {
    listen 80;
    listen [::]:80;
    server_name worklynx.io www.worklynx.io;
    return 301 https://www.worklynx.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name worklynx.io;

    ssl_certificate     /etc/letsencrypt/live/worklynx.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worklynx.io/privkey.pem;

    return 301 https://www.worklynx.io$request_uri;
}

# --- Main site ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.worklynx.io;

    ssl_certificate     /etc/letsencrypt/live/worklynx.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worklynx.io/privkey.pem;

    root /var/www/worklynx/dist;   # ← adjust to the real deploy path
    index index.html;

    # Compression (HTML is already gzipped today; JS/CSS are not)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml application/xml text/xml text/plain;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # One URL per page: /hrms/ → /hrms
    rewrite ^/(.+)/$ /$1 permanent;

    # Cache via `expires` (not add_header) so the security headers above are
    # inherited by every location.

    # Hashed build assets never change → cache for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Images, video and fonts in /public
    location ~* \.(?:webp|avif|png|jpe?g|svg|ico|mp4|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Marketing pages: prerendered HTML per route, real 404 for anything else
    location / {
        expires -1;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
