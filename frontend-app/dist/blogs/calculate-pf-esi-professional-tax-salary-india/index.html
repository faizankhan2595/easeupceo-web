    <noscript><article><h1>How to Calculate PF, ESI and Professional Tax on Salary in India (With Example)</h1><p><time datetime="2026-11-06T09:15:00.000000Z">6 Nov 2026</time></p><p><strong>Short answer:</strong> In India, the employee and employer each contribute <strong>12%</strong> of PF wages (basic pay plus DA) to Provident Fund. Of the employer's 12%, 8.33% goes to the pension scheme (EPS), capped at a wage of ₹15,000 (₹1,250 a month), and the rest goes to EPF. ESI applies when gross monthly wages are <strong>₹21,000 or less</strong>: the employee pays <strong>0.75%</strong> and the employer pays <strong>3.25%</strong>. Professional tax is set by each state and is capped at ₹2,500 a year.</p><h2>Step 1: Work out PF wages</h2><p>PF is calculated on basic pay plus dearness allowance (DA). Under India's new labour codes, if allowances exceed 50% of total pay, the excess may also count as wages, so check your salary structure first (see <a rel="noopener noreferrer nofollow" href="https://eabe42ea-5817-470f-92c4-a4ef5925b826.frame.claudeusercontent.com/blog/india-new-labour-codes-payroll-changes">India's new labour codes explained</a>).</p><h2>Step 2: Calculate PF contributions</h2><ul><li><p><strong>Employee PF:</strong> 12% of PF wages, deducted from salary.</p></li><li><p><strong>Employer EPS:</strong> 8.33% of PF wages, up to a maximum of ₹1,250 a month.</p></li><li><p><strong>Employer EPF:</strong> the rest of the employer's 12%.</p></li><li><p><strong>Employer extras:</strong> EDLI insurance and EPF admin charges are paid on top. Check current rates on the EPFO portal.</p></li></ul><h2>Step 3: Check whether ESI applies</h2><p>ESI applies to employees whose gross monthly wages are ₹21,000 or less (₹25,000 for persons with disabilities). The employee contributes 0.75% of gross wages and the employer contributes 3.25%.</p><h2>Step 4: Deduct professional tax</h2><p>Professional tax (PT) depends on your state and the employee's salary slab. Some states, such as Delhi, don't levy it at all. The maximum is ₹2,500 per employee per year. [CONFIRM: add the PT slab for your main state, e.g. Maharashtra or Karnataka.]</p><h2>Worked example</h2><p>Monthly gross salary of ₹20,000, made up of basic ₹10,000, HRA ₹5,000 and special allowance ₹5,000. Basic is exactly 50% of total pay, so PF wages are ₹10,000.</p><ul><li><p><strong>Employee PF:</strong> 12% × ₹10,000 = ₹1,200</p></li><li><p><strong>Employer EPS:</strong> 8.33% × ₹10,000 = ₹833</p></li><li><p><strong>Employer EPF:</strong> ₹1,200 − ₹833 = ₹367</p></li><li><p><strong>Employee ESI:</strong> 0.75% × ₹20,000 = ₹150</p></li><li><p><strong>Employer ESI:</strong> 3.25% × ₹20,000 = ₹650</p></li><li><p><strong>Professional tax:</strong> depends on state (assume ₹200)</p></li></ul><p><strong>Take-home pay before income tax:</strong> ₹20,000 − ₹1,200 − ₹150 − ₹200 = <strong>₹18,450</strong>. The employer's statutory cost on top of gross pay is ₹1,200 (PF) + ₹650 (ESI) = ₹1,850, plus EDLI and admin charges.</p><h2>Common mistakes to avoid</h2><ol><li><p>Calculating PF on gross pay instead of PF wages.</p></li><li><p>Forgetting the ₹1,250 EPS cap for employees earning above ₹15,000.</p></li><li><p>Continuing ESI after an employee's wages go above the limit. Coverage continues until the end of the contribution period, then stops.</p></li><li><p>Using the wrong state's PT slab for employees in branch offices.</p></li><li><p>Paying contributions late. PF and ESI are due by the 15th of the following month.</p></li></ol><h2>How Worklynx helps</h2><p>Worklynx payroll calculates statutory deductions automatically for each employee and keeps a record for every pay run. [CONFIRM: Worklynx supports PF, ESI and PT calculation, challans/returns, and which states.]</p><h2>Frequently asked questions</h2><h3>Is PF mandatory for every employee?</h3><p>PF is mandatory for establishments with 20 or more employees, and for employees earning PF wages up to ₹15,000 a month. Employees above that limit can join voluntarily.</p><h3>What is the ESI wage limit?</h3><p>₹21,000 gross per month, or ₹25,000 for persons with disabilities.</p><h3>Can PF be calculated on ₹15,000 even if basic is higher?</h3><p>Yes. Many employers cap PF wages at ₹15,000 for higher earners, if the employee agrees. Contributions above the cap are optional.</p><h3>Is professional tax charged in every state?</h3><p>No. Only some states levy it, and slabs differ by state.</p><p><em>Rates are correct at the time of writing. Always check current rates on the EPFO, ESIC and state tax websites.</em></p><p><strong>Tired of payroll spreadsheets?</strong> <a rel="noopener noreferrer nofollow" href="https://eabe42ea-5817-470f-92c4-a4ef5925b826.frame.claudeusercontent.com/in">See Worklynx for India</a>.</p></article><p><a href="/blogs">All articles</a></p><p><a href="/">Worklynx UK</a> · <a href="/in">Worklynx India</a> · <a href="/hrms">HR &amp; Payroll Software</a> · <a href="/inventory-management">Inventory Management &amp; EPOS</a> · <a href="/restaurant-management">Restaurant POS</a> · <a href="/pricing">Pricing</a> · <a href="/blogs">Blog</a> · <a href="/contact">Contact</a></p></noscript>
