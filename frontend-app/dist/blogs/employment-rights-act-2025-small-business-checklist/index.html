    <noscript><article><h1>Employment Rights Act 2025: A Checklist for UK Small Businesses</h1><p><time datetime="2026-11-04T09:39:00.000000Z">4 Nov 2026</time></p><p><strong>Short answer:</strong> The Employment Rights Act 2025 is being introduced in stages. Since <strong>6 April 2026</strong>, Statutory Sick Pay is payable from the first day of sickness absence, and paternity leave and unpaid parental leave are day-one rights. From <strong>January 2027</strong>, the qualifying period for unfair dismissal is expected to fall from two years to six months. Small businesses should update their absence process, contracts and probation reviews now.</p><h2>What changed in April 2026?</h2><ul><li><p><strong>Statutory Sick Pay from day one:</strong> the three waiting days have been removed, and so has the lower earnings limit, so more low-paid staff now qualify.</p></li><li><p><strong>Day-one paternity leave:</strong> employees no longer need 26 weeks' service to take paternity leave.</p></li><li><p><strong>Day-one unpaid parental leave:</strong> the one-year service requirement has been removed.</p></li><li><p><strong>Fair Work Agency:</strong> a new enforcement body was set up on 7 April 2026 to enforce rights such as holiday pay and the minimum wage.</p></li></ul><h2>What's coming in 2027?</h2><ul><li><p><strong>Unfair dismissal (expected January 2027):</strong> the qualifying period is expected to fall from two years to six months.</p></li><li><p><strong>Fire and rehire (January 2027):</strong> tighter limits on dismissing and re-engaging staff to change their terms.</p></li><li><p><strong>Zero-hours and low-hours workers (2027):</strong> rights to guaranteed hours that reflect what they usually work, plus reasonable notice of shifts and pay for late cancellations.</p></li><li><p><strong>Flexible working (2027):</strong> employers will need to explain more fully why a refusal is reasonable.</p></li></ul><p>Dates for the 2027 measures may still change. Source: <a rel="noopener noreferrer nofollow" href="https://www.legalchoices.org.uk/at-work/employment-rights/employment-rights-act-2025-timeline">Legal Choices, Employment Rights Act 2025 timeline</a>.</p><h2>Your small business checklist</h2><ol><li><p><strong>Update your sickness absence policy and payroll</strong> so SSP starts from day one.</p></li><li><p><strong>Update family leave policies</strong> to remove the service requirements.</p></li><li><p><strong>Tighten probation:</strong> set clear goals and review dates, and keep written records, ready for the six-month unfair dismissal rule.</p></li><li><p><strong>Review zero-hours contracts</strong> and how you notify and cancel shifts.</p></li><li><p><strong>Keep good records</strong> of holiday, hours, pay and absence. The Fair Work Agency can ask for them.</p></li><li><p><strong>Train line managers</strong> on handling absence, flexible working requests and performance.</p></li></ol><h2>How Worklynx helps</h2><p>Worklynx keeps absence, leave, contracts and employee records in one system, so you can apply new rules consistently and show records when asked. Worklynx HR and HMRC payroll software is built for UK small businesses and starts from £6 per employee per month. [CONFIRM: Worklynx UK features, e.g. SSP calculation, probation reminders, leave policies, document storage.]</p><h2>Frequently asked questions</h2><h3>When did day-one Statutory Sick Pay start?</h3><p>On 6 April 2026.</p><h3>When will the unfair dismissal qualifying period change?</h3><p>It is expected to fall from two years to six months in January 2027. Check <a rel="noopener noreferrer nofollow" href="http://GOV.UK">GOV.UK</a> for the confirmed date.</p><h3>Does the Employment Rights Act apply to very small businesses?</h3><p>Yes. Most of the changes apply to all employers, whatever their size.</p><h3>What is the Fair Work Agency?</h3><p>A government body set up in April 2026 to enforce employment rights such as holiday pay, the minimum wage and SSP.</p><p><em>This article is general information, not legal advice. Check </em><a rel="noopener noreferrer nofollow" href="http://GOV.UK"><em>GOV.UK</em></a><em> or an employment adviser for your situation.</em></p><p><strong>Keep your HR records ready.</strong> <a rel="noopener noreferrer nofollow" href="https://eabe42ea-5817-470f-92c4-a4ef5925b826.frame.claudeusercontent.com/hrms">See Worklynx HR and payroll</a>.</p></article><p><a href="/blogs">All articles</a></p><p><a href="/">Worklynx UK</a> · <a href="/in">Worklynx India</a> · <a href="/hrms">HR &amp; Payroll Software</a> · <a href="/inventory-management">Inventory Management &amp; EPOS</a> · <a href="/restaurant-management">Restaurant POS</a> · <a href="/pricing">Pricing</a> · <a href="/blogs">Blog</a> · <a href="/contact">Contact</a></p></noscript>
