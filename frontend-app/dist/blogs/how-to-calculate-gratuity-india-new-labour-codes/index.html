    <noscript><article><h1>How to Calculate Gratuity in India Under the New Labour Codes (With Examples)</h1><p><time datetime="2026-11-10T06:08:52.000000Z">10 Nov 2026</time></p><p><strong>Short answer:</strong> Gratuity in India is calculated as <strong>last drawn monthly wages × 15 ÷ 26 × completed years of service</strong>. "Wages" means basic pay, dearness allowance (DA) and retaining allowance. Under the new labour codes, in force since 21 November 2025, permanent employees still need five years of continuous service, but fixed-term employees qualify after one year. If allowances are more than 50% of total pay, the excess is added back to wages, which can increase gratuity.</p><h2>Who is eligible for gratuity?</h2><ul><li><strong>Permanent employees:</strong> after five years of continuous service, on resignation, retirement or termination.</li><li><strong>Fixed-term employees:</strong> after one year of service, under the Code on Social Security, 2020.</li><li><strong>Death or disablement:</strong> gratuity is payable regardless of length of service.</li></ul><h2>What is the gratuity formula?</h2><p><strong>Gratuity = last drawn monthly wages × 15 ÷ 26 × completed years of service</strong></p><ul><li><strong>15</strong> stands for 15 days' wages for every completed year.</li><li><strong>26</strong> is the number of working days in a month used by the formula.</li><li>A part year of more than six months is usually counted as a full year. For example, 7 years and 8 months counts as 8 years.</li></ul><h2>Example 1: a permanent employee</h2><p>Priya's basic pay plus DA is ₹40,000 a month. She resigns after 7 years and 8 months, which counts as 8 years.</p><p>Gratuity = 40,000 × 15 ÷ 26 × 8 = <strong>₹1,84,615</strong></p><h2>Example 2: how the 50% wage rule changes gratuity</h2><p>Arjun earns ₹60,000 a month: basic pay of ₹20,000 and allowances of ₹40,000. Under the old approach, gratuity was based on ₹20,000.</p><p>Under the labour codes, allowances above 50% of total pay are added back to wages. Half of ₹60,000 is ₹30,000, so his allowances are ₹10,000 over the limit. His wages for gratuity become ₹20,000 + ₹10,000 = <strong>₹30,000</strong>.</p><ul><li>Old basis, 10 years: 20,000 × 15 ÷ 26 × 10 = ₹1,15,385</li><li>New basis, 10 years: 30,000 × 15 ÷ 26 × 10 = <strong>₹1,73,077</strong></li></ul><p>That is about 50% more for the same employee. Read more about the <a href="https://worklynx.io/blogs/india-new-labour-codes-payroll-changes">new labour codes and payroll changes</a>.</p><h2>Is there a maximum, and is gratuity taxable?</h2><p>The statutory ceiling has been ₹20 lakh. For most private-sector employees, the tax-exempt amount is the lowest of three figures: the amount under the formula, the gratuity actually paid, and ₹20 lakh. Anything above that is taxed as salary. Check the latest notifications and confirm with your tax adviser for high-tenure employees.</p><h2>A checklist for HR and payroll teams</h2><ol><li>Recheck salary structures against the 50% wage rule.</li><li>Recalculate gratuity provisions for every employee on the new wage base.</li><li>Flag fixed-term employees who complete one year of service.</li><li>Track service dates accurately, including breaks and transfers.</li><li>Include gratuity in full and final settlement workflows.</li><li>Keep nomination forms up to date.</li></ol><h2>How Worklynx helps</h2><p>Worklynx keeps employee records, salary structures, service dates and payroll in one system, so HR teams can track eligibility and plan gratuity costs without spreadsheets. <a href="https://worklynx.io/in">See Worklynx for India</a>.</p><h2>Frequently asked questions</h2><h3>Is gratuity calculated on CTC or basic pay?</h3><p>On wages: basic pay, DA and retaining allowance. Under the labour codes, allowances above 50% of total pay are added back, so a low basic pay no longer keeps gratuity low.</p><h3>Do fixed-term employees get gratuity?</h3><p>Yes. Under the new labour codes they qualify after one year of service.</p><h3>Does notice period count towards service?</h3><p>Yes. Service until the last working day, including the notice period served, counts as service.</p><h3>Can an employer refuse to pay gratuity?</h3><p>Only in limited cases, such as termination for specific misconduct set out in law. In normal exits, it must be paid.</p><p><em>This article is general information, not legal or tax advice.</em></p><p><strong>Want gratuity and payroll in one place?</strong> <a href="https://worklynx.io/pricing">See Worklynx plans</a>.</p></article><p><a href="/blogs">All articles</a></p><p><a href="/">Worklynx UK</a> · <a href="/in">Worklynx India</a> · <a href="/hrms">HR &amp; Payroll Software</a> · <a href="/inventory-management">Inventory Management &amp; EPOS</a> · <a href="/restaurant-management">Restaurant POS</a> · <a href="/pricing">Pricing</a> · <a href="/blogs">Blog</a> · <a href="/contact">Contact</a></p></noscript>
