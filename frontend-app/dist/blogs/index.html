    <noscript><h1>Worklynx Blog</h1><p>Practical guides for UK small businesses on HR, payroll, leave, onboarding and running a restaurant or shop, from the Worklynx team.</p><ul><li><a href="/blogs/statutory-sick-pay-changes-2026-uk-employers">Statutory Sick Pay Changes 2026: What UK Employers Must Do</a> — Since 6 April 2026, SSP is paid from the first day of sickness and the Lower Earnings Limit is gone. Here's what changed, how to calculate SSP now, and a checklist for small businesses.</li><li><a href="/blogs/how-to-calculate-gratuity-india-new-labour-codes">How to Calculate Gratuity in India Under the New Labour Codes (With Examples)</a> — The gratuity formula, who is eligible after one year or five years, how the new 50% wage rule changes the amount, and worked examples for HR and payroll teams.</li><li><a href="/blogs/reorder-point-safety-stock-formula">How to Calculate Reorder Point and Safety Stock (Formula and Example)</a> — Stop running out of stock. Learn the reorder point and safety stock formulas, with a worked example you can copy for your own products.</li><li><a href="/blogs/outgrown-hr-spreadsheets-signs">8 Signs Your Business Has Outgrown HR Spreadsheets</a> — Spreadsheets work for HR when you're small. Here are 8 clear signs it's time to move to HR software, and how to switch without disruption.</li><li><a href="/blogs/uk-minimum-wage-april-2026-payroll-checklist">UK Minimum Wage from April 2026: Rates and a Payroll Checklist</a> — The National Living Wage rose to £12.71 an hour on 1 April 2026. Here are all the current rates, plus the payroll mistakes that most often lead to underpayment.</li><li><a href="/blogs/calculate-pf-esi-professional-tax-salary-india">How to Calculate PF, ESI and Professional Tax on Salary in India (With Example)</a> — A step-by-step guide to calculating employee and employer PF, ESI and professional tax in India, with a worked salary example and common mistakes to avoid.</li><li><a href="/blogs/employment-rights-act-2025-small-business-checklist">Employment Rights Act 2025: A Checklist for UK Small Businesses</a> — Day-one SSP and paternity leave started in April 2026, and the unfair dismissal qualifying period is expected to drop to six months in 2027. What UK small businesses need to change, and when.</li><li><a href="/blogs/india-new-labour-codes-payroll-changes">India's New Labour Codes: What HR and Payroll Teams Must Change</a> — India's four labour codes took effect on 21 November 2025. Here's what the 50% wage rule, the new gratuity rules and faster final settlements mean for your payroll and HR processes.</li><li><a href="/blogs/hr-metrics-every-growing-company-should-track">8 HR Metrics Every Growing Company Should Track</a> — You do not need a data team to run HR on numbers. These eight workforce metrics show where to act on hiring, retention, attendance and cost.</li><li><a href="/blogs/annual-reviews-to-continuous-feedback">From Annual Reviews to Continuous Feedback: A Practical Guide</a> — Once-a-year reviews often arrive too late to help. Learn how to build a continuous feedback rhythm with goals, check-ins and lighter reviews.</li><li><a href="/blogs/attendance-leave-management-hybrid-teams">Attendance and Leave Management for Hybrid Teams</a> — When people split time between home, office and the field, attendance and leave get harder to track fairly. Here is how to set clear policies and tools that work.</li><li><a href="/blogs/employee-onboarding-checklist-first-90-days">The Employee Onboarding Checklist for Your First 90 Days</a> — Good onboarding starts before day one and runs well past the first week. Use this checklist to plan every stage of a new hire's first 90 days.</li><li><a href="/blogs/payroll-automation-cutting-errors">Payroll Automation: Cutting Errors and Saving Hours Every Month</a> — Manual payroll is slow and error-prone. Here is where payroll mistakes come from and how automation removes them, step by step.</li><li><a href="/blogs/how-to-choose-
