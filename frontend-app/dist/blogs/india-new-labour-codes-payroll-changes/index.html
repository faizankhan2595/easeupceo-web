    <noscript><article><h1>India's New Labour Codes: What HR and Payroll Teams Must Change</h1><p><time datetime="2026-11-04T09:35:00.000000Z">4 Nov 2026</time></p><p><strong>Short answer:</strong> India's four labour codes (Wages, Social Security, Industrial Relations, and Occupational Safety, Health and Working Conditions) took effect on <strong>21 November 2025</strong>, replacing 29 older central labour laws. The biggest payroll change is the new definition of "wages": if allowances make up more than 50% of total pay, the excess is added back to wages. This can increase PF and gratuity costs and reduce take-home pay. Final dues on exit must now be paid within two working days.</p><h2>What are the four labour codes?</h2><ul><li><p><strong>Code on Wages:</strong> minimum wages, payment of wages, bonus and equal pay.</p></li><li><p><strong>Code on Social Security:</strong> PF, ESI, gratuity, maternity benefit, and benefits for gig and platform workers.</p></li><li><p><strong>Industrial Relations Code:</strong> standing orders, layoffs, retrenchment, closures and grievance committees.</p></li><li><p><strong>Occupational Safety, Health and Working Conditions Code:</strong> working conditions, contract labour and overtime.</p></li></ul><h2>What is the 50% wage rule?</h2><p>Under the codes, "wages" mainly means basic pay, dearness allowance (DA) and retaining allowance. If other parts of pay, such as HRA, special allowance and bonuses, add up to more than 50% of total remuneration, the extra amount is treated as wages.</p><p><strong>Example:</strong> an employee earns ₹40,000 a month with basic pay of ₹14,000 and allowances of ₹26,000. Half of total pay is ₹20,000, so the allowances are ₹6,000 over the limit. That ₹6,000 is added back, and wages for statutory purposes become ₹20,000 instead of ₹14,000.</p><h2>Which payroll and HR processes need to change?</h2><ol><li><p><strong>Salary structures:</strong> review every CTC template so basic pay plus DA is at least 50% of total pay, or plan for the add-back.</p></li><li><p><strong>Gratuity:</strong> calculate gratuity on the new wage definition. Fixed-term employees are now entitled to pro-rata gratuity without completing five years of service.</p></li><li><p><strong>Full and final settlement:</strong> pay pending wages within two working days of the last working day, including on resignation.</p></li><li><p><strong>Overtime:</strong> pay at twice the normal wage rate, with the worker's consent.</p></li><li><p><strong>Fixed-term staff:</strong> give them the same pay, hours and benefits as permanent staff doing similar work, in proportion to their service.</p></li><li><p><strong>Grievance committee:</strong> set one up if you have 20 or more workers.</p></li><li><p><strong>Documentation:</strong> update appointment letters, policies and employee handbooks.</p></li></ol><h2>What is still pending?</h2><p>Some parts are not yet in force, including the PF and pension scheme provisions of the Social Security Code. Many state rules are still being notified. Until a state notifies its rules, existing rules generally continue where they don't conflict with the codes. Keep watching your state's notifications, especially for working hours and leave under shops and establishments laws.</p><p>Source: <a rel="noopener noreferrer nofollow" href="https://webiis10.mondaq.com/india/employee-rights-labour-relations/1715314/labour-law-reform-takes-effect-quick-primer-for-employers">Mondaq, "Labour Law Reform Takes Effect"</a>.</p><h2>How Worklynx helps</h2><p>Worklynx keeps employee records, salary structures and payroll in one place, so HR teams can review pay components and update them in bulk. [CONFIRM: which labour code features Worklynx supports, e.g. the 50% wage check, gratuity calculation, full and final settlement workflow.]</p><h2>Frequently asked questions</h2><h3>When did India's labour codes come into force?</h3><p>On 21 November 2025. Some provisions and many state rules are still being notified.</p><h3>Will take-home pay go down under the new labour codes?</h3><p>It can, if basic pay has to rise to meet the 50% rule, because PF deductions are based on wages. Total CTC may stay the same.</p><h3>Do fixed-term employees get gratuity now?</h3><p>Yes. Fixed-term employees are entitled to pro-rata gratuity without the five-year service requirement that applies to permanent staff.</p><h3>How quickly must full and final settlement be paid?</h3><p>Within two working days of the employee's last working day.</p><p><em>This article is general information, not legal advice. Check the latest central and state rules with a labour law adviser.</em></p><p><strong>Getting your payroll ready?</strong> <a rel="noopener noreferrer nofollow" href="https://eabe42ea-5817-470f-92c4-a4ef5925b826.frame.claudeusercontent.com/in">See Worklynx for India</a>.</p></article><p><a href="/blogs">All articles</a></p><p><a href="/">Worklynx UK</a> · <a href="/in">Worklynx India</a> · <a href="/hrms">HR &amp; Payroll Software</a> · <a href="/inventory-management">Inventory Management &amp; EPOS</a> · <a href="/restaurant-management">Restaurant POS</a> · <a href="/pricing">Pricing</a> · <a href="/blogs">Blog</a> · <a href="/contact">Contact</a></p></noscript>
