    <noscript><article><h1>Statutory Sick Pay Changes 2026: What UK Employers Must Do</h1><p><time datetime="2026-11-11T06:52:34.000000Z">11 Nov 2026</time></p><p><strong>Short answer:</strong> From <strong>6 April 2026</strong>, under the Employment Rights Act 2025, Statutory Sick Pay (SSP) changed in three ways: it is paid from the <strong>first day</strong> of sickness instead of the fourth, the <strong>Lower Earnings Limit no longer applies</strong>, so low earners now qualify, and the weekly amount is the <strong>lower of 80% of average weekly earnings or the flat SSP rate</strong> (£123.25 a week for 2026/27). Employers need to update payroll settings, sickness policies and contracts.</p><h2>What changed in April 2026?</h2><ul><li><strong>No more waiting days:</strong> previously SSP started on the fourth day of sickness. Now it is payable from day one.</li><li><strong>No Lower Earnings Limit:</strong> previously employees had to earn at least £125 a week to get SSP. That test has gone, so part-time and low-paid staff now qualify. The government expects more than a million extra workers to become eligible.</li><li><strong>New calculation:</strong> employees get the lower of 80% of their average weekly earnings or the flat weekly rate, so low earners are not paid more when sick than when working.</li></ul><p>Sources: <a href="https://www.acas.org.uk/statutory-sick-pay-changes-2026">Acas</a>; <a href="https://www.pricebailey.co.uk/blog/statutory-sick-pay-changes/">Price Bailey</a>.</p><h2>How do you calculate SSP now?</h2><p>Work out the employee's average weekly earnings, take 80% of it, and compare it with the flat rate. Pay whichever is lower.</p><ul><li><strong>Example 1:</strong> Sam earns £400 a week. 80% is £320, which is more than £123.25, so Sam gets <strong>£123.25 a week</strong>.</li><li><strong>Example 2:</strong> Aisha works part-time and earns £100 a week. Before April 2026 she would have got nothing. Now 80% is £80, which is less than £123.25, so she gets <strong>£80 a week</strong>.</li></ul><p>SSP for part of a week is worked out using the employee's qualifying days, usually their normal working days.</p><h2>A checklist for UK employers</h2><ol><li><strong>Update your payroll software</strong> so SSP starts on day one and uses the 80% comparison.</li><li><strong>Review staff who earn under £125 a week.</strong> They are now entitled to SSP.</li><li><strong>Update your sickness absence policy</strong> and employee handbook to remove waiting days.</li><li><strong>Check contracts and company sick pay schemes.</strong> Enhanced sick pay must still meet the SSP minimum.</li><li><strong>Record sickness from the first day</strong>, including short one- or two-day absences that you may not have paid before.</li><li><strong>Brief line managers</strong> on reporting rules and return-to-work conversations.</li><li><strong>Budget for the cost</strong> of paying short absences.</li></ol><p>See also our <a href="https://worklynx.io/blogs/employment-rights-act-2025-small-business-checklist">Employment Rights Act 2025 checklist</a> and <a href="https://worklynx.io/blogs/uk-minimum-wage-april-2026-payroll-checklist">UK minimum wage April 2026 guide</a>.</p><h2>How Worklynx helps</h2><p>Worklynx brings absence records, employee details and payroll into one place, so you can track sickness from day one and pay staff correctly. <a href="https://worklynx.io/hrms">See Worklynx HR</a>.</p><h2>Frequently asked questions</h2><h3>Is SSP now paid from the first day of sickness?</h3><p>Yes. Since 6 April 2026 the three waiting days have been removed.</p><h3>Do part-time workers get SSP?</h3><p>Yes. The Lower Earnings Limit was removed, so employees on low pay now qualify, at 80% of their average weekly earnings if that is lower than the flat rate.</p><h3>Has the maximum length of SSP changed?</h3><p>No. SSP is still paid for up to 28 weeks.</p><h3>Can employers pay more than SSP?</h3><p>Yes. Many employers offer company sick pay, but it cannot be less than SSP.</p><p><em>This article is general information, not legal advice. Check GOV.UK for the latest rates and rules.</em></p><p><strong>Want sickness and payroll in one system?</strong> <a href="https://worklynx.io/pricing">See Worklynx plans</a>.</p></article><p><a href="/blogs">All articles</a></p><p><a href="/">Worklynx UK</a> · <a href="/in">Worklynx India</a> · <a href="/hrms">HR &amp; Payroll Software</a> · <a href="/inventory-management">Inventory Management &amp; EPOS</a> · <a href="/restaurant-management">Restaurant POS</a> · <a href="/pricing">Pricing</a> · <a href="/blogs">Blog</a> · <a href="/contact">Contact</a></p></noscript>
