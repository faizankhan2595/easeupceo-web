    <noscript><article><h1>UK Minimum Wage from April 2026: Rates and a Payroll Checklist</h1><p><time datetime="2026-11-09T07:11:42.000000Z">9 Nov 2026</time></p><p><strong>Short answer:</strong> From <strong>1 April 2026</strong>, the National Living Wage for workers aged 21 and over is <strong>£12.71 an hour</strong>. The rate for 18–20-year-olds is <strong>£10.85</strong>, and the rate for 16–17-year-olds and eligible apprentices is <strong>£8.00</strong>. Underpayments usually happen through deductions, unpaid working time, or staff moving into a higher age band, not through the headline rate.</p><h2>What are the minimum wage rates from April 2026?</h2><ul><li><strong>National Living Wage (21 and over):</strong> £12.71 an hour, up from £12.21</li><li><strong>18–20 year olds:</strong> £10.85 an hour, up from £10.00</li><li><strong>16–17 year olds:</strong> £8.00 an hour, up from £7.55</li><li><strong>Apprentices</strong> (under 19, or in the first year of their apprenticeship): £8.00 an hour</li></ul><p>Source: <a href="https://www.peninsulagrouplimited.com/blog/new-national-minimum-wage-rates-confirmed-for-april-2026/">Peninsula, April 2026 rates</a>. Always confirm on GOV.UK.</p><h2>What does £12.71 an hour mean for a full-time salary?</h2><p>For a 37.5-hour week: £12.71 × 37.5 × 52 = <strong>£24,784.50 a year</strong>. For a 40-hour week it is <strong>£26,436.80 a year</strong>.</p><h2>Six payroll mistakes that cause underpayment</h2><ol><li><strong>Deductions for uniforms or equipment</strong> that take pay below the minimum.</li><li><strong>Unpaid working time,</strong> such as training, security checks, opening and closing, or travel between jobs.</li><li><strong>Salaried staff working extra hours,</strong> which can push their hourly rate below the minimum.</li><li><strong>Birthdays:</strong> not moving staff to the higher rate when they reach 18 or 21.</li><li><strong>Apprentices</strong> staying on the apprentice rate after they turn 19 and finish their first year.</li><li><strong>Salary sacrifice schemes</strong> that reduce pay below the minimum.</li></ol><h2>Your April payroll checklist</h2><ol><li>Update hourly rates for every affected employee from the first pay period starting on or after 1 April.</li><li>Check salaried staff by dividing pay by hours actually worked.</li><li>Set birthday reminders for staff approaching 18 and 21.</li><li>Review all deductions and salary sacrifice arrangements.</li><li>Keep pay and hours records for at least six years.</li></ol><h2>How Worklynx helps</h2><p>Worklynx stores pay rates, hours and dates of birth together, so you can spot staff who need a rate change before payday. Worklynx HR and HMRC payroll software is built for UK small businesses and starts from £6 per employee per month.</p><h2>Frequently asked questions</h2><h3>What is the minimum wage in the UK in 2026?</h3><p>From 1 April 2026: £12.71 an hour for workers aged 21 and over, £10.85 for 18–20-year-olds, and £8.00 for 16–17-year-olds and eligible apprentices.</p><h3>Does the National Living Wage apply to 21-year-olds?</h3><p>Yes. Since April 2024, the National Living Wage applies from age 21.</p><h3>What happens if I underpay the minimum wage?</h3><p>You must pay back arrears at current rates, and you can face penalties and be publicly named.</p><p><strong>Make your next pay rise simple.</strong> <a href="https://worklynx.io/hrms">See Worklynx HR and payroll</a>.</p></article><p><a href="/blogs">All articles</a></p><p><a href="/">Worklynx UK</a> · <a href="/in">Worklynx India</a> · <a href="/hrms">HR &amp; Payroll Software</a> · <a href="/inventory-management">Inventory Management &amp; EPOS</a> · <a href="/restaurant-management">Restaurant POS</a> · <a href="/pricing">Pricing</a> · <a href="/blogs">Blog</a> · <a href="/contact">Contact</a></p></noscript>
